<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="/assets/ICON.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACIAL R US - SIGN UP</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- intl-tel-input CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/18.2.1/css/intlTelInput.css" />
    <style>
        .iti {
            width: 100%;
        }

        .iti__flag {
            background-image: url("https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/18.2.1/img/flags.png");
        }

        @media (min-resolution: 2x) {
            .iti__flag {
                background-image: url("https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/18.2.1/img/flags@2x.png");
            }
        }
    </style>
</head>

<body class="auth-bg">

    <div class="page-wrapper">

        <div class="brand-section">
            <img src="./assets/ICON.svg" alt="Facial R Us Logo" class="nav-logo">
            <h1 class="brand-title">FACIAL R US</h1>
        </div>

        <div class="signup-card">
            <h1>Greetings</h1>
            <p class="subtitle">Register an account</p>

            <div id="register-error"
                style="color: #8b2d2d; background: #fdf2f2; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; font-size: 0.9rem; font-family: 'Poppins', sans-serif;">
            </div>

            <form id="register-form">
                <div class="input-group">
                    <label for="firstname">First Name</label>
                    <input type="text" id="firstname" name="firstname" required>
                </div>

                <div class="input-group">
                    <label for="lastname">Last Name</label>
                    <input type="text" id="lastname" name="lastname" required>
                </div>

                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <p class="terms-text">
                    By signing up, you agree to Facial R Us'<br>
                    <a href="#">Terms and Conditions</a> & <a href="#">Privacy Policy</a>
                </p>

                <button type="submit" class="submit-btn">SIGN UP</button>
            </form>

            <p class="footer-text">Already have an account? <a href="login.html">Log in</a></p>
        </div>

    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const firstname = document.getElementById('firstname').value.trim();
            const lastname = document.getElementById('lastname').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('register-error');

            if (!firstname || !lastname || !username || !email || !password) {
                errorEl.textContent = 'Please fill in all fields.';
                errorEl.style.display = 'block';
                return;
            }

            const fullName = firstname + ' ' + lastname;
            const result = await Auth.register(fullName, username, email, password);

            if (result.success) {
                console.log('Account created successfully! Welcome to Facial R Us.');
                window.location.href = 'index.html';
            } else {
                errorEl.textContent = result.message;
                errorEl.style.display = 'block';
            }
        });
    </script>

</body>

</html>
