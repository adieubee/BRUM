<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="/assets/ICON.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARBER R US - Payment Successful</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .success-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .success-card {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        .success-icon {
            font-size: 4rem;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        .success-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 10px;
        }

        .success-text {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-view {
            display: inline-block;
            background: #333;
            color: white;
            padding: 12px 30px;
            border-radius: 6px;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-view:hover {
            background: #555;
            transform: translateY(-2px);
        }

        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 0, 0, .1);
            border-radius: 50%;
            border-top-color: #333;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="services-body">

    <header class="navbar">
        <div class="nav-brand">
            <a href="../index.html" class="nav-logo-link">
                <img src="../assets/ICON.svg" alt="Barber R Us Logo" class="nav-logo">
                <span class="nav-title">BARBER R US</span>
            </a>
        </div>
        <nav class="nav-links">
            <a href="../services.html">Services</a>
            <a href="../branches.html">Branches</a>
            <a href="../about-us.html">About Us</a>
            <a href="../login.html" class="nav-btn" id="navAuthBtn">Login | Sign Up</a>
        </nav>
    </header>

    <div class="success-container">
        <div class="success-card" id="statusCard">
            <div class="loading-spinner"></div>
            <h2 class="success-title">Confirming Payment...</h2>
            <p class="success-text">Please wait while we verify your transaction.</p>
        </div>
    </div>

    <!-- ═══ FOOTER ═══ -->
    <footer class="footer">
        <div class="container">
            <div class="footer-brand">BARBER R US</div>
            <div class="footer-links">
                <a href="../index.html">Home</a>
                <a href="../services.html">Services</a>
                <a href="../branches.html">Branches</a>
                <a href="../about-us.html">About Us</a>
            </div>
            <div class="footer-divider"></div>
            <p>&copy; 2026 Barber R Us Management System. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        window.EMAILJS_PUBLIC_KEY = '';
        window.EMAILJS_SERVICE_ID = '';
        window.EMAILJS_TEMPLATE_ID = '';

        async function loadEmailJsConfig() {
            try {
                const response = await fetch('/api/emailjs-config');
                const data = await response.json();
                if (!data || !data.success || !data.config) {
                    return false;
                }

                window.EMAILJS_PUBLIC_KEY = data.config.publicKey || '';
                window.EMAILJS_SERVICE_ID = data.config.serviceId || '';
                window.EMAILJS_TEMPLATE_ID = data.config.templateId || '';

                if (window.emailjs && window.EMAILJS_PUBLIC_KEY) {
                    emailjs.init({ publicKey: window.EMAILJS_PUBLIC_KEY });
                }

                return Boolean(window.EMAILJS_PUBLIC_KEY && window.EMAILJS_SERVICE_ID && window.EMAILJS_TEMPLATE_ID);
            } catch (error) {
                console.warn('Unable to load EmailJS config:', error);
                return false;
            }
        }

        function formatEmailDateForBrowser(value) {
            if (!value) return '';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return new Intl.DateTimeFormat('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            }).format(date);
        }

        function formatEmailTimeForBrowser(value) {
            if (!value) return '';
            const match = String(value).trim().match(/^([0-9]{1,2}):([0-9]{2})(?::([0-9]{2}))?$/);
            if (!match) return value;
            const hour24 = Number(match[1]);
            const minute = match[2];
            const suffix = hour24 >= 12 ? 'PM' : 'AM';
            const hour12 = hour24 % 12 === 0 ? 12 : hour24 % 12;
            return `${hour12}:${minute} ${suffix}`;
        }

        async function sendBookingConfirmationEmail({ toEmail, clientName, date, time, branchAddress, services, bookingUrl, message }) {
            if (!window.emailjs || !toEmail || !window.EMAILJS_SERVICE_ID || !window.EMAILJS_TEMPLATE_ID) {
                console.warn('EmailJS is not fully configured. Skipping confirmation email.');
                return false;
            }

            try {
                const templateParams = {
                    to_email: toEmail,
                    client_name: clientName,
                    appointment_date: formatEmailDateForBrowser(date),
                    appointment_time: formatEmailTimeForBrowser(time),
                    branch_address: branchAddress,
                    services: services,
                    booking_url: bookingUrl,
                    message: message || 'No additional message provided.',
                    subject: 'Your Barber R Us appointment is confirmed'
                };

                await emailjs.send(window.EMAILJS_SERVICE_ID, window.EMAILJS_TEMPLATE_ID, templateParams);
                return true;
            } catch (error) {
                console.error('EmailJS send failed:', error);
                return false;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const user = Auth.getUser();
            if (!user) {
                window.location.href = '../login.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const idsParam = urlParams.get('ids');
            const statusCard = document.getElementById('statusCard');

            if (!idsParam) {
                statusCard.innerHTML = `
                    <i class="fa-solid fa-circle-exclamation success-icon" style="color: #f44336;"></i>
                    <h2 class="success-title">Invalid Session</h2>
                    <p class="success-text">We couldn't verify this payment session.</p>
                    <a href="my-appointments.html" class="btn-view">View My Appointments</a>
                `;
                return;
            }

            const ids = idsParam.split(',').filter(id => id.trim() !== '');

            try {
                const response = await fetch('/api/bookings/payment-success', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids })
                });

                const result = await response.json();

                if (result.success) {
                    const bookingUrl = `${window.location.origin}/client/my-appointments.html`;
                    const emailState = result.email_details || null;
                    const emailJsReady = await loadEmailJsConfig();

                    if (emailJsReady && emailState && emailState.to_email) {
                        await sendBookingConfirmationEmail({
                            toEmail: emailState.to_email,
                            clientName: emailState.client_name || user.name || 'there',
                            date: emailState.date || '',
                            time: emailState.time || '',
                            branchAddress: emailState.branch_address || '',
                            services: emailState.services || '',
                            bookingUrl,
                            message: emailState.message || ''
                        });
                    }

                    statusCard.innerHTML = `
                        <i class="fa-solid fa-circle-check success-icon"></i>
                        <h2 class="success-title">Booking Confirmed!</h2>
                        <p class="success-text">Your booking and recorded down payment are confirmed. A confirmation email is sent from the browser when EmailJS is configured.</p>
                        <a href="my-appointments.html" class="btn-view">View My Appointments</a>
                    `;
                } else {
                    throw new Error(result.message || 'Verification failed');
                }
            } catch (error) {
                console.error("Payment confirmation error:", error);
                statusCard.innerHTML = `
                    <i class="fa-solid fa-circle-exclamation success-icon" style="color: #ff9800;"></i>
                    <h2 class="success-title">Booking Recorded</h2>
                    <p class="success-text">Your booking was created, but the confirmation status could not be updated. Please check My Appointments and try again if needed.</p>
                    <a href="my-appointments.html" class="btn-view">View My Appointments</a>
                `;
            }
        });
    </script>
</body>

</html>
