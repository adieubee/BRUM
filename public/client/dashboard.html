<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="/assets/ICON.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARBERS R US - Client Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="services-body">

    <header class="navbar">
        <div class="nav-brand">
            <a href="../index.html" class="nav-logo-link">
                <img src="../assets/ICON.svg" alt="Barbers R Us Logo" class="nav-logo">
                <span class="nav-title">BARBERS R US</span>
            </a>
        </div>

        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
        </button>

        <nav class="nav-links" id="navLinks">
            <a href="../services.html">Services</a>
            <a href="../branches.html">Branches</a>
            <a href="../about-us.html">About Us</a>
            <a href="../login.html" class="nav-btn" id="navAuthBtn">Login | Sign Up</a>
        </nav>
    </header>

    <section class="dashboard-page-section">
        <div class="dashboard-card">

            <h2 class="dashboard-greeting">Hello, <span id="dashGreetingName">John Doe</span></h2>

            <div class="profile-pill">
                <div class="profile-left">
                    <div class="avatar-circle">
                        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="50" cy="50" r="50" fill="#c76b6b" />
                            <path d="M50 60C33.4315 60 20 73.4315 20 90H80C80 73.4315 66.5685 60 50 60Z"
                                fill="#fcfaf3" />
                            <circle cx="50" cy="40" r="18" fill="#fcdbb6" />
                            <path
                                d="M40 30C40 25 45 20 50 20C55 20 60 25 60 30V35C60 40 55 45 50 45C45 45 40 40 40 35V30Z"
                                fill="#1e293b" />
                        </svg>
                    </div>
                    <div class="profile-info">
                        <h3 id="dashFullName">John Doe</h3>
                        <p id="dashUsername">@johndoe123</p>
                        <p id="dashEmail">you@example.com</p>
                    </div>
                </div>

                <button class="edit-btn" title="Edit Profile" onclick="openEditModal()">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a46464" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </button>
            </div>

            <div class="dashboard-stats-row">
                <div class="stat-pill history-pill">
                    <h4>Booking History</h4>
                    <p class="stat-number">2</p>
                </div>

                <a href="my-appointments.html" class="stat-pill appointments-pill">
                    <h4>View My Appointments</h4>
                </a>
            </div>

            <button class="logout-btn" onclick="logoutUser()">Log Out</button>

            <div id="editModal" class="modal">
                <div class="modal-content">
                    <span class="close" onclick="closeEditModal()">&times;</span>
                    <h3 style="font-family: 'Brown Sugar', serif; color: #8b2d2d; font-size: 2rem; margin-top: 0;">Edit
                        Profile</h3>
                    <form id="editProfileForm">
                        <div class="input-group">
                            <label for="editName">Full Name</label>
                            <input type="text" id="editName" required>
                        </div>
                        <div class="input-group">
                            <label for="editUsername">Username</label>
                            <input type="text" id="editUsername" required>
                        </div>
                        <div class="input-group">
                            <label for="editEmail">Email Address</label>
                            <input type="email" id="editEmail" required>
                        </div>
                        <button type="submit" class="submit-btn" style="width: 100%;">Save Changes</button>
                    </form>
                </div>
            </div>

        </div>
    </section>

    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = Auth.getUser();
            if (!user) {
                window.location.href = '../login.html';
                return;
            }

            // Populate dashboard profile
            document.getElementById('dashGreetingName').textContent = user.name;
            document.getElementById('dashFullName').textContent = user.name;
            if (user.username) document.getElementById('dashUsername').textContent = '@' + user.username;
            if (user.email) document.getElementById('dashEmail').textContent = user.email;

            // Booking history count via API
            try {
                const response = await fetch(`/api/bookings/my?client_id=${user.id}`);
                const data = await response.json();
                if (data.success) {
                    const historyEl = document.querySelector('.stat-number');
                    if (historyEl) historyEl.textContent = data.appointments.length;
                }
            } catch (err) {
                console.error("Error fetching history:", err);
            }
        });

        function openEditModal() {
            const user = Auth.getUser();
            if (user) {
                document.getElementById('editName').value = user.name || '';
                document.getElementById('editUsername').value = user.username || '';
                document.getElementById('editEmail').value = user.email || '';
            }
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function logoutUser() {
            if (confirm('Are you sure you want to logout?')) {
                Auth.logout();
            }
        }

        document.getElementById('editProfileForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const user = Auth.getUser() || {};
            const newName = document.getElementById('editName').value.trim();
            const newUsername = document.getElementById('editUsername').value.trim();
            const newEmail = document.getElementById('editEmail').value.trim();

            try {
                const response = await fetch('/api/users/update', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: user.id,
                        name: newName,
                        username: newUsername,
                        email: newEmail
                    })
                });

                const result = await response.json();

                if (result.success) {
                    // Update LocalStorage session so the browser remembers the new details
                    const updatedUser = {
                        ...user,
                        name: newName,
                        username: newUsername,
                        email: newEmail
                    };
                    localStorage.setItem('currentUser', JSON.stringify(updatedUser));

                    document.getElementById('dashGreetingName').textContent = updatedUser.name;
                    document.getElementById('dashFullName').textContent = updatedUser.name;
                    document.getElementById('dashUsername').textContent = '@' + updatedUser.username;
                    document.getElementById('dashEmail').textContent = updatedUser.email;

                    closeEditModal();
                    console.log('Profile updated successfully!');
                } else {
                    console.log('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Update profile error:', error);
                console.log('Server connection failed.');
            }
        });
    </script>

</body>

</html>
