<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="/assets/ICON.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARBERS R US - LOGIN</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="page-wrapper">

        <div class="brand-section">
            <a href="index.html" style="text-decoration: none;">
                <img src="./assets/ICON.svg" alt="BARBERS R US Logo" class="nav-logo">
                <h1 class="brand-title">BARBERS R US</h1>
            </a>
        </div>

        <div class="login-card">
            <h1>Welcome Back</h1>
            <p class="subtitle">Log in to your account</p>

            <div id="login-error"
                style="color: #8b2d2d; background: #fdf2f2; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; font-size: 0.9rem; font-family: 'Poppins', sans-serif;">
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="username">Username/Email Address</label>
                    <input type="text" id="username" name="username">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password">
                </div>

                <button type="submit" class="submit-btn">LOG IN</button>
            </form>

            <p class="footer-text">New to Barbers R Us? <a href="register.html">Sign up</a></p>
        </div>

    </div>

    <script src="js/auth.js"></script>
    <script>

        const loginError = document.getElementById('login-error');
        const loginParams = new URLSearchParams(window.location.search);
        if (loginParams.has('expired')) { loginError.textContent = 'Session expired or permissions changed. Please sign in again.'; loginError.style.display='block'; }
        else if (loginParams.get('error') === 'admin_access') {
            loginError.textContent = 'Access denied. Client accounts cannot access the admin dashboard. Please use an admin or staff account.';
            loginError.style.display = 'block';
        } else if (loginParams.get('error') === 'staff_access') {
            loginError.textContent = 'Access denied. This page is only available to admin accounts. Please use the staff dashboard or an admin account.';
            loginError.style.display = 'block';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = loginError;

            if (!username || !password) {
                errorEl.textContent = 'Please fill in all fields.';
                errorEl.style.display = 'block';
                return;
            }

            const result = await Auth.login(username, password);

            if (result.success) {
                // Check for redirect param (only for clients)
                const params = new URLSearchParams(window.location.search);
                const redirect = params.get('redirect');

                switch (result.role) {
                    case 'admin':
                        window.location.href = 'admin/dashboard.html';
                        break;
                    case 'staff':
                        window.location.href = 'staff/dashboard.html';
                        break;
                    case 'client':
                    default:
                        window.location.href = (redirect && redirect.startsWith('/') && !redirect.startsWith('//') ? redirect : 'index.html');
                }
            } else {
                errorEl.textContent = result.message;
                errorEl.style.display = 'block';
            }
        });
    </script>

</body>

</html>
