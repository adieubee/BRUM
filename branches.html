<!DOCTYPE html>
<html lang="en">

<head>
   <link rel="icon" type="image/x-icon" href="/assets/ICON.ico">
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Barbers R Us Locations | Barbershop Branches in Bulacan & Malabon</title>
   <meta name="description"
      content="Visit Barbers R Us at our barbershop branches in Malolos, Pulilan, and Malabon. Find your nearest location and book your appointment today.">
   <meta name="keywords"
      content="Barbers R Us branches, Malolos barbershop, Pulilan barber, Malabon haircuts, barbershop locations">
   <link rel="canonical" href="https://Barbers R Us.vercel.app/branches.html">
   <link rel="stylesheet" href="css/style.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="services-body">

   <header class="navbar">
      <div class="nav-brand">
         <a href="index.html" class="nav-logo-link">
            <img src="./assets/ICON.svg" alt="Barbers R Us Logo" class="nav-logo">
            <span class="nav-title">Barbers R Us</span>
         </a>
      </div>

      <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
         <i class="fas fa-bars"></i>
      </button>

      <nav class="nav-links" id="navLinks">
         <a href="services.html">Services</a>
         <a href="branches.html">Branches</a>
         <a href="about-us.html">About Us</a>
         <a href="login.html" class="nav-btn" id="navAuthBtn">Login | Sign Up</a>
      </nav>
   </header>

   <section class="services-page-section">
      <div class="branches-bg-curve"></div>

      <div class="services-content-wrapper">
         <div class="services-page-header">
            <h2>OUR BARBERSHOPS</h2>
            <p>Visit Your Nearest Barbers R Us Location</p>
         </div>

         <div class="map-container">
            <!-- PLACEHOLDER: Google Maps or location map showing all three barbershop branches in the Bulacan/Malabon area -->
            <iframe id="branchMap" src="https://maps.google.com/maps?q=Malolos+Bulacan&t=&z=12&ie=UTF8&iwloc=&output=embed"
               width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
               referrerpolicy="no-referrer-when-downgrade">
            </iframe>
         </div>

         <div class="branches-grid" id="branchesContainer"></div>
      </div>
   </section>


   <script>
      document.addEventListener('DOMContentLoaded', () => {
         renderBranches();
      });

      function renderBranches() {
         const container = document.getElementById('branchesContainer');
         if (!container) return;

         const staticBranches = [
            { 
               branch_id: 1, 
               name: "Malolos Branch", 
               address: "RB Building, Arbe Compound Cor. Mac Arthur Hi-Way, Malolos, 3000 Bulacan",
               phone: "(034) 123-4567",
               hours: "Mon to Sun 9:00AM - 8:00PM",
               features: "Walk-ins Welcome • Free WiFi • Parking Available"
            },
            { 
               branch_id: 2, 
               name: "Pulilan Branch", 
               address: "2nd Floor, GSM Bldg., Regional Rd., Pulilan, Bulacan",
               phone: "(034) 123-4568",
               hours: "Mon to Sun 9:00AM - 8:00PM",
               features: "Appointments Preferred • Waiting Area • Premium Atmosphere"
            },
            { 
               branch_id: 3, 
               name: "Malabon Branch", 
               address: "4B Manapat St., Tanong, Malabon",
               phone: "(02) 8123-4569",
               hours: "Mon to Sun 9:00AM - 8:00PM",
               features: "Modern Facility • Expert Staff • Relaxing Ambiance"
            }
         ];

         container.innerHTML = '';

         staticBranches.forEach(branch => {
            const card = document.createElement('div');
            card.className = 'branch-card';

            card.innerHTML = `
                <div>
                    <h3>${branch.name}</h3>
                    <div class="branch-info-row">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#777777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        <p>${branch.address}</p>
                    </div>
                    <div class="branch-info-row">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#777777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        <p>${branch.phone}</p>
                    </div>
                    <div class="branch-info-row">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#777777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        <p>${branch.hours}</p>
                    </div>
                    <div class="branch-info-row" style="margin-top: 12px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#494949" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <p style="color: #585858; font-size: 0.85rem;">${branch.features}</p>
                    </div>
                </div>
                <div class="branch-actions">
                    <a href="client/booking.html?branch=${encodeURIComponent(branch.name)}" class="branch-btn">Book Now</a>
                    <button type="button" class="map-btn" onclick="updateMap('${branch.address}')">View Map</button>
                </div>
            `;
            container.appendChild(card);
         });
      }

      function updateMap(address) {
         const mapIframe = document.getElementById('branchMap');
         mapIframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(address)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
         document.querySelector('.map-container').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
   </script>

   <!-- ═══ FOOTER ═══ -->
   <footer class="footer">
      <div class="container">
         <div class="footer-brand">Barbers R Us</div>
         <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="branches.html">Branches</a>
            <a href="about-us.html">About Us</a>
         </div>
         <div class="footer-divider"></div>
         <p>&copy; 2026 Barbers R Us Management System. All rights reserved.</p>
      </div>
   </footer>

   <script src="js/auth.js"></script>
   <script src="js/main.js"></script>
</body>

</html>
